services:
  policy-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        NODE_IMAGE: ${POLICY_NODE_IMAGE:-node:24-bookworm-slim}
    container_name: e-agent-policy-api
    restart: unless-stopped
    ports:
      - "${POLICY_API_BIND:-0.0.0.0:18080}:8080"
    environment:
      POLICY_DB_PATH: /app/data/policy-national-v1.sqlite
      POLICY_API_TOKEN_FILE: /run/secrets/policy_token
      POLICY_DOCUMENT_COLLECTION: ${POLICY_DOCUMENT_COLLECTION:-}
      POLICY_PASSAGE_COLLECTION: ${POLICY_PASSAGE_COLLECTION:-}
      POLICY_EMBEDDING_URL: ${POLICY_EMBEDDING_URL:-http://vllm-qwen3-embedding-4b:8000}
      POLICY_CHROMA_URL: ${POLICY_CHROMA_URL:-http://chroma:8000}
      POLICY_EMBEDDING_MODEL: ${POLICY_EMBEDDING_MODEL:-qwen3-embedding-4b}
      POLICY_SEMANTIC_TIMEOUT_MS: ${POLICY_SEMANTIC_TIMEOUT_MS:-2000}
      POLICY_DOCUMENT_CANDIDATES: ${POLICY_DOCUMENT_CANDIDATES:-12}
      POLICY_PASSAGE_CANDIDATES: ${POLICY_PASSAGE_CANDIDATES:-32}
      POLICY_DOCUMENT_MAX_DISTANCE: ${POLICY_DOCUMENT_MAX_DISTANCE:-0.9}
      POLICY_PASSAGE_MAX_DISTANCE: ${POLICY_PASSAGE_MAX_DISTANCE:-0.45}
      POLICY_EMBEDDING_CACHE_ENTRIES: ${POLICY_EMBEDDING_CACHE_ENTRIES:-256}
    networks:
      - retrieval
    secrets:
      - policy_token
    volumes:
      - "${POLICY_DATA_DIR:?set POLICY_DATA_DIR in .env}:/app/data:ro"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      options:
        max-size: 10m
        max-file: "3"

secrets:
  policy_token:
    file: ${POLICY_API_TOKEN_FILE:?set POLICY_API_TOKEN_FILE in .env}

networks:
  retrieval:
    name: ${POLICY_RETRIEVAL_NETWORK:-policy-retrieval}
    external: true
