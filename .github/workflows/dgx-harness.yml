name: DGX Harness image

on:
  push:
    branches: [main]
    paths:
      - 'deploy/dgx/**'
      - '.dockerignore'
      - 'apps/cli/config/examples/environment-policy-dgx.patch.yml'
      - 'apps/cli/package.json'
      - 'apps/cli/tests/profiles/web/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/dgx-harness.yml'
  pull_request:
    branches: [main]
    paths:
      - 'deploy/dgx/**'
      - '.dockerignore'
      - 'apps/cli/config/examples/environment-policy-dgx.patch.yml'
      - 'apps/cli/package.json'
      - 'apps/cli/tests/profiles/web/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/dgx-harness.yml'

permissions:
  contents: read

jobs:
  image:
    name: ARM64 image and keyless startup
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test secret loading and launcher delegation
        run: node --test deploy/dgx/*.test.mjs

      - name: Build the native ARM64 application image
        run: docker build -f deploy/dgx/Dockerfile -t e-agent-harness:local .

      - name: Verify isolated startup without databases or models
        run: sh deploy/dgx/smoke-test.sh
