name: e-agent-combined
services:
  harness:
    image: ${HARNESS_IMAGE:?}
    build:
      context: ../..
      dockerfile: deploy/dgx/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-bookworm-slim}
        DSH_CLIENT_COMMIT_HASH: ${SOURCE_REVISION:?}
    network_mode: host
    restart: unless-stopped
    init: true
    user: '1000:1000'
    entrypoint: [/bin/sh, /app/deploy/dgx-combined/entrypoint.sh]
    command: [web, --patch, /state/dsh/deployment/policy.patch.yml, --no-open]
    environment:
      HARNESS_BIND_ADDRESS: ${HARNESS_BIND_ADDRESS:?}
      HARNESS_PORT: ${HARNESS_PORT:-3081}
      HARNESS_TRUSTED_HOSTS: ${HARNESS_TRUSTED_HOSTS:?}
      POLICY_RELEASE_DIR: /release
      POLICY_V2_DB_PATH: /release/policy.sqlite
      POLICY_V2_VECTOR_MANIFEST_PATH: /release/vectors/manifest.json
      POLICY_V2_LATEST_MANIFEST_PATH: /release/latest.json
      POLICY_V2_SEMANTIC_CONFIG_PATH: /state/dsh/deployment/policy-semantic.json
      POLICY_V2_GRAPH_CONFIG_PATH: /state/dsh/deployment/policy-graph.json
      DGX_QWEN_API_KEY_FILE: /run/secrets/qwen_api_key
      DGX_QWEN_API_BASE_URL: ${DGX_QWEN_API_BASE_URL:?}
    volumes:
      - ${RELEASE_DIR:?}:/release:ro
      - ${STATE_DIR:?}:/state
      - ${WORKSPACE_DIR:?}:/workspace
    secrets: [qwen_api_key]
    read_only: true
    tmpfs:
      - /tmp:exec,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, 'node -e "fetch(''http://''+process.env.HARNESS_BIND_ADDRESS+'':''+process.env.HARNESS_PORT+''/'').then(r=>process.exit(r.status===401?0:1)).catch(()=>process.exit(1))"']
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 120s
    logging:
      options: {max-size: 10m, max-file: '3'}
  vectors:
    image: ${VECTOR_IMAGE:-e-agent-combined-vectors:1.3.5}
    build:
      context: ../..
      dockerfile: deploy/dgx-combined/Dockerfile.vectors
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim-bookworm}
    network_mode: host
    restart: unless-stopped
    user: '1000:1000'
    volumes:
      - ${RELEASE_DIR:?}:/release
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      options: {max-size: 10m, max-file: '3'}
  graph:
    image: ${NEO4J_IMAGE:-neo4j:5.26.32-community}
    restart: unless-stopped
    ports: ['127.0.0.1:17475:7474']
    environment:
      NEO4J_AUTH: none
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - ${GRAPH_DATA_DIR:?}:/data
    logging:
      options: {max-size: 10m, max-file: '3'}
  sqlite-viewer:
    image: ${DATASETTE_IMAGE:-e-agent-datasette:0.65.5}
    network_mode: host
    restart: unless-stopped
    user: '1000:1000'
    command: [datasette, /data/policy.sqlite, --host, 127.0.0.1, --port, '18105', --setting, allow_download, 'off']
    volumes:
      - ${RELEASE_DIR:?}/policy.sqlite:/data/policy.sqlite:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      options: {max-size: 10m, max-file: '3'}
  viewers:
    image: ${VIEWER_IMAGE:-e-agent-db-viewers:local}
    network_mode: host
    restart: unless-stopped
    user: '1000:1000'
    entrypoint: [/bin/sh, /deployment/viewer-entrypoint.sh]
    environment:
      VIEWERS_BIND_ADDRESS: ${HARNESS_BIND_ADDRESS:?}
      SQLITE_VIEWER_PORT: ${SQLITE_VIEWER_PORT:-18111}
      CHROMA_VIEWER_PORT: ${CHROMA_VIEWER_PORT:-18112}
    volumes:
      - .:/deployment:ro
    secrets: [viewer_htpasswd]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      options: {max-size: 10m, max-file: '3'}
secrets:
  qwen_api_key:
    file: ${QWEN_API_KEY_FILE:?}
  viewer_htpasswd:
    file: ${VIEWERS_HTPASSWD_FILE:?}
