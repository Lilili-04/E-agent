name: e-agent-harness

services:
  harness:
    image: ${HARNESS_IMAGE:-e-agent-harness:local}
    build:
      context: ../..
      dockerfile: deploy/dgx/Dockerfile
      args:
        NODE_IMAGE: ${HARNESS_NODE_IMAGE:-node:24-bookworm-slim}
        DSH_CLIENT_COMMIT_HASH: ${HARNESS_SOURCE_REVISION:-}
    restart: unless-stopped
    init: true
    user: "1000:1000"
    ports:
      - "${HARNESS_BIND_ADDRESS:?set HARNESS_BIND_ADDRESS}:${HARNESS_PORT:-3080}:3080"
    environment:
      HARNESS_TRUSTED_HOSTS: ${HARNESS_TRUSTED_HOSTS:?set HARNESS_TRUSTED_HOSTS}
      DGX_POLICY_API_URL: ${DGX_POLICY_API_URL:-http://e-agent-policy-api:8080}
      DGX_POLICY_API_TOKEN_FILE: /run/secrets/policy_token
      DGX_QWEN_API_BASE_URL: ${DGX_QWEN_API_BASE_URL:-http://vllm-qwen38-27b:8000/v1}
      DGX_QWEN_API_KEY_FILE: /run/secrets/qwen_api_key
    secrets:
      - policy_token
      - qwen_api_key
    volumes:
      - type: bind
        source: ${HARNESS_STATE_DIR:?set HARNESS_STATE_DIR}
        target: /state
        bind:
          create_host_path: false
      - type: bind
        source: ${HARNESS_WORKSPACE_DIR:?set HARNESS_WORKSPACE_DIR}
        target: /workspace
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [retrieval]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
    logging:
      options:
        max-size: 10m
        max-file: "3"

secrets:
  policy_token:
    file: ${POLICY_API_TOKEN_FILE:?set POLICY_API_TOKEN_FILE}
  qwen_api_key:
    file: ${QWEN_API_KEY_FILE:?set QWEN_API_KEY_FILE}

networks:
  retrieval:
    name: ${POLICY_RETRIEVAL_NETWORK:-policy-retrieval}
    external: true
