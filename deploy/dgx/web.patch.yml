# The listener is inside the container. Compose limits the published host IP.
- id: webserver
  config:
    host: 0.0.0.0
    port: 3080
    compression: gzip
    compressionLevel: 1
    compressionThresholdBytes: 1024

- id: web-runtime
  config:
    openBrowser: false
    printUrl: true
    surfaceContext: true
    trustedHosts: !!js process.env.HARNESS_TRUSTED_HOSTS.split(',').map(value => value.trim()).filter(Boolean)

- id: hmr
  disabled: true
