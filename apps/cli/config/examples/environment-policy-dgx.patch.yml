# Optional environment-policy preset and DGX model route. Secrets stay outside Git.
- id: agent-preset-registry
  config:
    default: environment-policy

- insert:
    - id: preset-environment-policy
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: environment-policy
        name: 环境政策法规问答
        description: 检索 DGX 环境政策法规库，依据原文回答条款、主题、发布日期、效力状态和版本问题，并列出来源。
        order: 0
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: 你是环境政策法规问答助手。
              suffix: >-
                回答环境政策、法规、污染治理、生态保护或生产建设合规问题前，必须先调用 policy_search，并以返回的原文为依据。
                question 保留用户原问题；问题含“目前、当前、现行、有效”等时，同时填写 current_date，使用对话时间上下文提供的 YYYY-MM-DD 日期。
                确认文件是否收录正文时，核对结果中的文件标题；其他文件仅引用该名称，不代表库中收录了其正文，不得据此编造条款。
                来源只使用证据提供的文号和日期；缺失或只有孤立数字时省略，不得补造。
          - id: environment-policy
            name: cordis:group
            group: true
            isolate:
              environmentPolicyKnowledge: true
            config:
              - id: environment-policy-remote-service
                name: '@deepseek-ai/dsh-experimental-environment-policy/remote-service'
                config:
                  endpoint: !!js process.env.DGX_POLICY_API_URL
                  tokenFile: !!js process.env.DGX_POLICY_API_TOKEN_FILE
                  timeoutMs: 8000
              - id: tool-environment-policy
                name: '@deepseek-ai/dsh-experimental-environment-policy/tools'
                config:
                  maxResults: 8
                  maxEvidenceCharacters: 12000

- id: llm-pi-ai
  config:
    providers:
      dgx-qwen38:
        displayName: DGX Qwen3.8
        apiKeyEnv: DGX_QWEN38_API_KEY
        api: openai-completions
        baseURL: http://vllm-qwen38-27b:8000/v1
        timeoutMs: 180000
        streamIdleTimeoutMs: 60000
        retryPolicy:
          mode: normal
          maxRetries: 1
        compat:
          supportsStore: false
          supportsDeveloperRole: false
          supportsReasoningEffort: false
          supportsUsageInStreaming: true
          maxTokensField: max_tokens
          chatTemplateKwargs:
            enable_thinking: false
        models:
          - id: qwen3.8-27b
            name: Qwen3.8-27B（DGX NVFP4）
            contextWindow: 32768
            maxTokens: 2048
            input: [text]
            reasoningEfforts: false

- id: agent-default-model
  config:
    provider: dgx-qwen38
    model: qwen3.8-27b

- id: time-context
  disabled: false
  config:
    timeZone: Asia/Shanghai
